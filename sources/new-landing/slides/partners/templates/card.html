{{ sass("&/partners.sass") }}
<a href="{{ data.link }}" class="partner__button" target="_blank">
    <div class="partner__logo">
        <img src="{{ static(data.img) }}" alt="" class="partner__square-image"></img>
    </div>
    <div class="partner__header">
        {{ data.header }}
    </div>
    <div class="partner__text">
        {{ data.text }}
    </div>
</a>
