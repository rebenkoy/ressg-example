on:
  push:
    branches:
      - 'updates'
name: Deploy to test
jobs:
  web-deploy:
    name: Deploy
    environment: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set short sha
        id: vars
        run: |
          echo "prefix=r-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT;
          echo 'marker=<!-- [ AUTOGENERATED ] -->' >> $GITHUB_OUTPUT;
      - name: Set comment text
        id: comment_gen
        run: echo 'res=<a href="${{ vars.PREVIEW_URL }}/${{ steps.vars.outputs.prefix }}/">![Preview Badge](https://img.shields.io/badge/>>Preview<<-1f883d?style=for-the-badge)</a>' >> $GITHUB_OUTPUT
      - name: pull-request-action
        uses: vsoch/pull-request-action@master
        env:
          PULL_REQUEST_TITLE: "Updates"
          PULL_REQUEST_BODY: ${{ steps.comment_gen.outputs.res }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_PREFIX: ""
          PULL_REQUEST_BRANCH: "master"
          PULL_REQUEST_UPDATE: true
        id: pr
      - name: Find Comment
        uses: peter-evans/find-comment@v4
        id: find_comment
        with:
          direction: 'last'
          issue-number: ${{ steps.pr.outputs.pull_request_number }}
          body-includes: ${{ steps.vars.outputs.marker }}
      - name: Set comment text
        if: steps.find_comment.outputs.comment-id != 0
        id: outdated_gen
        run: |
          echo '${{ steps.find_comment.outputs.comment-body }}' > /tmp/outdated-comment;
          sed -E 's/>>Preview<<-1f883d/>>Outdated_Preview<<-e76c1a/' -i /tmp/outdated-comment;
          perl -pe 's|\Q${{ steps.vars.outputs.marker }}\E||g' -i /tmp/outdated-comment
          echo "res=$(cat /tmp/outdated-comment)" >> $GITHUB_OUTPUT;
      - name: Update outdated comment
        if: steps.find_comment.outputs.comment-id != 0
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ steps.pr.outputs.pull_request_number }}
          body: ${{ steps.outdated_gen.outputs.res }}
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          edit-mode: 'replace'
      - name: Create comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ steps.pr.outputs.pull_request_number }}
          body: "${{ steps.comment_gen.outputs.res }}${{ steps.vars.outputs.marker }}"
      - name: Get reSsg
        uses: jaxxstorm/action-install-gh-release@v2.1.0
        with:
          repo: rebenkoy/reSsg
      - name: Run reSsg
        run: reSsg build --output=/tmp/output --prefix {{ steps.vars.outputs.prefix }}
      - name: SFTP upload
        uses: Dylan700/sftp-upload-action@latest
        with:
          server: ${{ vars.URL }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 2022
          uploads: |
            /tmp/output => ./${{ steps.vars.outputs.prefix }}